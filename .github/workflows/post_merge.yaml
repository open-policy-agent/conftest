name: 'post_merge'
on:
  push:
    branches:
      - 'master'

permissions: {}

jobs:
  docker-conftest:
    runs-on: ubuntu-latest
    env:
      IMAGE: openpolicyagent/conftest
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - name: checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v5

      - name: setup docker buildx
        run: docker buildx create --name conftestbuild --use

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # ratchet:docker/build-push-action@v7.3.0
        with:
          context: '.'
          push: false
          # The foo tag below validates putting one tag per line (like we do in the release flow)
          # works as expected.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:foo
          platforms: ${{ env.PLATFORMS }}

  docker-examples:
    runs-on: ubuntu-latest
    env:
      IMAGE: openpolicyagent/conftest
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - name: checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v5

      - name: setup docker buildx
        run: docker buildx create --name conftestbuild --use

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # ratchet:docker/build-push-action@v7.3.0
        with:
          context: '.'
          target: examples
          push: false
          tags: ${{ env.IMAGE }}:examples
          platforms: ${{ env.PLATFORMS }}
